
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Music Identifier</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>

<body>

  <main class="main" id="main">
    <div class="orb-area">
      <button id="identify" class="orb" type="button"
              aria-label="Identify music" title="Identify music">
        <span class="orb-ring" aria-hidden="true"></span>
        <span class="orb-ring ring-two" aria-hidden="true"></span>
        <svg id="orb-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </button>
    </div>

    <h1 id="headline" class="headline">Identify music</h1>
    <p id="subheading" class="subheading">
      Find out what's playing in your browser.
    </p>

    <div id="mode-switch" class="mode-switch"
         role="group" aria-label="Identification mode">
      <button id="mode-once" class="mode-button" type="button"
              aria-pressed="true">Identify once</button>
      <button id="mode-continuous" class="mode-button" type="button"
              aria-pressed="false">Continuous</button>
    </div>

    <section id="track-card" class="track-card" aria-label="Recognised track">
      <div id="track-eyebrow" class="track-eyebrow">Last identified</div>
      <div id="track-content">
        <div class="empty-track">
          Your recognised song will appear here.
        </div>
      </div>
      <div id="track-actions" class="track-actions" hidden>
        <button id="copy-track" class="text-button" type="button">
          Copy details
        </button>
        <a id="open-track" class="text-button" target="_blank"
           rel="noopener noreferrer" hidden>Open song</a>
      </div>
    </section>

    <div id="error-message" class="error-message" role="alert"></div>
  </main>

  <footer class="footer">
    <a id="history-link" class="footer-link" href="#">View history</a>
  </footer>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
